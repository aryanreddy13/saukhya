<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F7F9"/>
      <stop offset="100%" stop-color="#DCEEF3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle Medical / Clinic Room Geometry -->
  <rect x="40" y="40" width="720" height="520" rx="16" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
  
  <!-- Room Wall Accents -->
  <path d="M40 460 L760 460" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Therapy Table & Interaction -->
  <rect x="250" y="360" width="300" height="120" rx="12" fill="#FFFFFF" stroke="#0E4E63" stroke-width="2"/>
  
  <!-- Speech / Hearing Visual Representation -->
  <!-- Therapist Figure Placeholder Silhouette -->
  <circle cx="260" cy="240" r="45" fill="#0E4E63"/>
  <path d="M190 360 C190 300 220 285 260 285 C300 285 330 300 330 360" fill="#0E4E63"/>
  
  <!-- Patient / Child Figure Silhouette -->
  <circle cx="540" cy="270" r="38" fill="#D97736"/>
  <path d="M480 370 C480 320 510 308 540 308 C570 308 600 320 600 370" fill="#D97736"/>
  
  <!-- Sound Wave / Interactive Learning Blocks -->
  <rect x="360" y="320" width="40" height="40" rx="6" fill="#0E4E63"/>
  <text x="373" y="348" font-family="'Noto Sans', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">A</text>
  
  <rect x="410" y="300" width="40" height="40" rx="6" fill="#D97736"/>
  <text x="423" y="328" font-family="'Noto Sans', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">B</text>

  <!-- Speech Bubbles & Sound Waves -->
  <path d="M330 210 C350 200 380 205 380 225 C380 240 360 245 350 250 L345 265 L340 250 C325 248 315 235 315 225 C315 210 325 200 330 210 Z" fill="#E8F4F8" stroke="#0E4E63" stroke-width="1.5"/>
  <circle cx="340" cy="225" r="3" fill="#0E4E63"/>
  <circle cx="350" cy="225" r="3" fill="#0E4E63"/>
  <circle cx="360" cy="225" r="3" fill="#0E4E63"/>

  <path d="M470 230 C490 220 515 225 515 242 C515 255 500 260 490 265 L485 278 L482 265 C468 262 460 250 460 242 C460 228 470 220 470 230 Z" fill="#FDF6F0" stroke="#D97736" stroke-width="1.5"/>
  <path d="M480 245 C485 240 495 240 500 245" stroke="#D97736" stroke-width="2" stroke-linecap="round"/>

  <!-- Overlay Badge Placeholder -->
  <rect x="180" y="495" width="440" height="38" rx="8" fill="#FFFFFF" stroke="#0E4E63" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="400" y="519" font-family="'Noto Sans', sans-serif" font-size="13" font-weight="600" fill="#0E4E63" text-anchor="middle">
    [CLINIC_HERO_IMAGE: Authentic therapy / consultation room photograph]
  </text>
</svg>
